---
# XFCE desktop + xrdp, so each participant's RDP connection lands in their own
# graphical session (browser included). Included from main.yml only in rdp mode.
# Debian/Ubuntu only — the training image is Ubuntu.

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Ubuntu ships firefox/chromium as snaps that don't run under xrdp; pull a real
# .deb from Mozilla's APT repo instead.
- name: Add the Mozilla APT signing key
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"

# deb822_repository needs the python3-debian library on the target. Installed
# here as well as in the other roles so this one stays self-contained.
- name: Ensure python3-debian is present
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the Mozilla APT repository
  ansible.builtin.deb822_repository:
    name: mozilla
    types: [deb]
    uris: "https://packages.mozilla.org/apt"
    suites: [mozilla]
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/packages.mozilla.org.asc
    state: present

- name: Prefer the Mozilla firefox over the Ubuntu snap transitional package
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    mode: "0644"
    content: |
      # Managed by Ansible (guacamole role).
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000

      # Ubuntu's 'firefox' is a transitional stub pulling the snap, which does not
      # run under xrdp. Its epoch (1:1snap1-...) sorts above Mozilla's 153.0~build1,
      # so any apt upgrade happily "upgrades" the working .deb into a broken snap —
      # exactly what unattended-upgrades did on 2026-07-22. Never install it.
      Package: firefox firefox-esr
      Pin: release o=Ubuntu
      Pin-Priority: -1

- name: Install the XFCE desktop, xrdp, the emoji font and a browser
  ansible.builtin.apt:
    name: >-
      {{ guacamole_desktop_packages + guacamole_desktop_fonts
         + [guacamole_browser_package] }}
    state: present
    update_cache: true

# xrdp's Xorg backend needs any user allowed to start the X server.
- name: Allow any user to start X (xrdp Xorg backend)
  ansible.builtin.copy:
    dest: /etc/X11/Xwrapper.config
    mode: "0644"
    content: |
      # Managed by Ansible (guacamole role).
      allowed_users=anybody
      needs_root_rights=yes
  notify: Restart xrdp

# Force every xrdp session to launch XFCE (participant homes predate this role,
# so a system-wide startwm is simpler than seeding ~/.xsession everywhere).
- name: Make xrdp start an XFCE session
  ansible.builtin.copy:
    dest: /etc/xrdp/startwm.sh
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible (guacamole role).
      if test -r /etc/profile; then . /etc/profile; fi
      if test -r ~/.profile; then . ~/.profile; fi
      exec startxfce4
  notify: Restart xrdp

# --- Firefox defaults for every account ---------------------------------------
# Bookmarks are per-profile state in places.sqlite, which cannot be seeded
# idempotently. The enterprise policy file is the supported way to push them:
# Firefox reads /etc/firefox/policies/policies.json at startup for *every* user
# on the host, so students and the trainer all get the entries with no per-home
# task and no clobbering of bookmarks they add themselves.
- name: Ensure the Firefox policies directory exists
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"

# The welcome page documents the terminal shortcuts further down, and is served
# from a local file so it still opens when the training room's Internet does not.
# Written before policies.json, which points Firefox at it.
- name: Ensure the welcome page directory exists
  ansible.builtin.file:
    path: "{{ guacamole_welcome_path | dirname }}"
    state: directory
    mode: "0755"
  when: guacamole_welcome_page | bool

- name: Render the welcome page
  ansible.builtin.template:
    src: welcome.html.j2
    dest: "{{ guacamole_welcome_path }}"
    mode: "0644"
  when: guacamole_welcome_page | bool

- name: Push the shared Firefox bookmarks to every account
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
    content: |
      {{ {'policies': {
             'Bookmarks': guacamole_firefox_bookmarks,
             'Preferences': {
               'browser.toolbars.bookmarks.visibility': {
                 'Value': 'always' if guacamole_firefox_show_bookmarks_toolbar else 'newtab',
                 'Status': 'default'
               }
             }
           } | combine({'Homepage': {
                 'URL': 'file://' ~ guacamole_welcome_path,
                 'StartPage': 'homepage',
                 'Locked': false
               }} if guacamole_welcome_page | bool else {})
          } | to_nice_json }}

# --- Latency tuning ----------------------------------------------------------
# xrdp renders at 32bpp by default and guacd then downsamples for the browser:
# wasted CPU on both sides plus a bigger bitmap stream. Capping xrdp at the depth
# the connections request keeps the whole path consistent. tcp_nodelay matters
# most for the input path — with Nagle on, small keystroke/mouse frames get held
# back waiting for company. insertafter guarantees the keys land inside
# [Globals] even on an xrdp.ini that ships them commented out or not at all.
- name: Tune xrdp for a low-latency remote desktop
  ansible.builtin.lineinfile:
    path: /etc/xrdp/xrdp.ini
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }}={{ item.value }}"
    insertafter: '^\[Globals\]'
    mode: "0644"
  loop:
    - { key: max_bpp, value: "{{ guacamole_xrdp_max_bpp }}" }
    - { key: tcp_nodelay, value: "true" }
    - { key: tcp_keepalive, value: "true" }
    - { key: bitmap_compression, value: "true" }
    # fastpath input+output shaves a round-trip off each event (xrdp default,
    # pinned here so an image update cannot silently regress it).
    - { key: use_fastpath, value: "both" }
  loop_control:
    label: "{{ item.key }}"
  notify: Restart xrdp

# XFCE turns on the xfwm4 compositor by default. Every shadow/transparency it
# draws forces full-window redraws, which guacd must re-encode and ship to the
# browser — the biggest single contributor to the "slightly laggy" feel over
# RDP. box_move/box_resize additionally reduce dragging a window to a wireframe
# outline instead of a continuous repaint of its contents.
- name: Ensure the system-wide xfconf defaults directory exists
  ansible.builtin.file:
    path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
    state: directory
    mode: "0755"
  when: guacamole_tune_xfce | bool

- name: Disable XFCE compositing and live window dragging
  ansible.builtin.copy:
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!-- Managed by Ansible (guacamole role) — tuned for RDP over a WAN. -->
      <channel name="xfwm4" version="1.0">
        <property name="general" type="empty">
          <property name="use_compositing" type="bool" value="false"/>
          <property name="box_move" type="bool" value="true"/>
          <property name="box_resize" type="bool" value="true"/>
          <property name="show_frame_shadow" type="bool" value="false"/>
          <property name="show_popup_shadow" type="bool" value="false"/>
        </property>
      </channel>
  when: guacamole_tune_xfce | bool

# GTK's fade/slide animations repaint the same region several times per menu
# opening — cheap locally, a burst of bitmaps over RDP. Unlike xfwm4.xml above,
# xsettings.xml is shipped by the xfce4-settings package and carries the theme,
# fonts and cursor settings, so this edits the one property in place instead of
# rewriting the file. community.general.xml needs lxml on the target.
- name: Ensure python3-lxml is present (needed to edit the xfconf XML)
  ansible.builtin.apt:
    name: python3-lxml
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: guacamole_tune_xfce | bool

- name: Disable GTK animations in the desktop
  community.general.xml:
    path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
    xpath: "/channel/property[@name='Gtk']/property[@name='EnableAnimations']"
    attribute: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "type", value: "bool" }
    - { key: "value", value: "false" }
  loop_control:
    label: "{{ item.key }}"
  when: guacamole_tune_xfce | bool

# The files above are only *defaults*: xfconfd copies them into a participant's
# home on first login and reads the copy from then on, so anyone who already
# opened a desktop keeps the old compositing settings. Drop those two per-user
# files (window-manager prefs only — regenerated from the tuned defaults at the
# next login) so existing accounts get the tuning too.
# Participant identities are recomputed here (rather than scanning /home, which
# also holds the cloned training repos) so the tasks target exactly the files
# they mean to and nothing else. The list is reused further down for the
# terminal accel map, hence no dependency on guacamole_tune_xfce.
- name: Build the list of desktop accounts to reset
  ansible.builtin.set_fact:
    guac_desktop_users: >-
      {{ (range(user_start | int, (nb_users | int) + 1) | map('string')
          | map('regex_replace', '^', user_prefix) | list)
         + ([trainer_user] if trainer_user | default('') | length > 0 else []) }}
  when: guacamole_reset_desktop_prefs | bool

- name: Remove per-user XFCE prefs that would shadow the tuned defaults
  ansible.builtin.file:
    path: "/home/{{ item.0 }}/.config/xfce4/xfconf/xfce-perchannel-xml/{{ item.1 }}"
    state: absent
  loop: "{{ guac_desktop_users | default([]) | product(['xfwm4.xml', 'xsettings.xml']) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  when:
    - guacamole_tune_xfce | bool
    - guacamole_reset_desktop_prefs | bool

# --- Terminal emulator --------------------------------------------------------
# Every "Terminal" entry in XFCE (panel launcher, Applications menu, Ctrl+Alt+T,
# Thunar's "Open Terminal Here") runs `exo-open --launch TerminalEmulator`, which
# resolves through helpers.rc. Ubuntu ships it pointing at Debian's
# x-terminal-emulator alternative — and that alternative, in auto mode, resolves
# to *zutty*: same priority 40 as xfce4-terminal.wrapper, and it wins. zutty is a
# deliberately minimal emulator with no menubar, no tabs and no zoom, so every
# instruction about "File > New Tab" or a keyboard shortcut was landing on a
# terminal that has none of it — and the terminalrc below was being written for
# an emulator nobody ever launched.
#
# Both knobs are pinned: helpers.rc for everything going through exo, and the
# alternative itself for anything calling x-terminal-emulator directly.
- name: Make xfce4-terminal the preferred XFCE terminal emulator
  ansible.builtin.lineinfile:
    path: /etc/xdg/xfce4/helpers.rc
    regexp: '^TerminalEmulator='
    line: "TerminalEmulator=xfce4-terminal"
    mode: "0644"
  when: guacamole_terminal_theme | bool

- name: Point the x-terminal-emulator alternative at xfce4-terminal
  community.general.alternatives:
    name: x-terminal-emulator
    path: /usr/bin/xfce4-terminal.wrapper
  when: guacamole_terminal_theme | bool

# --- Terminal theme -----------------------------------------------------------
# One system-wide terminalrc for students and trainer alike. xfce4-terminal
# reads $XDG_CONFIG_HOME first and falls back to /etc/xdg, and it only ever
# writes the per-user copy when someone changes a setting through the UI — so
# this is picked up by existing accounts without the reset dance the xfconf
# defaults above need.
- name: Ensure the system-wide xfce4-terminal config directory exists
  ansible.builtin.file:
    path: /etc/xdg/xfce4/terminal
    state: directory
    mode: "0755"
  when: guacamole_terminal_theme | bool

- name: Set the default terminal theme for every account
  ansible.builtin.copy:
    dest: /etc/xdg/xfce4/terminal/terminalrc
    mode: "0644"
    content: |
      # Managed by Ansible (guacamole role) — defaults only, a participant can
      # still override any of this from Edit > Preferences.
      [Configuration]
      # The two *UseSystem/UseTheme switches must be off, otherwise
      # xfce4-terminal ignores the font and colours below and follows the GTK
      # theme instead (font-use-system defaults to TRUE).
      FontUseSystem=FALSE
      FontName={{ guacamole_terminal_font }}
      ColorUseTheme=FALSE
      ColorForeground={{ guacamole_terminal_fg }}
      ColorBackground={{ guacamole_terminal_bg }}
      ColorCursor={{ guacamole_terminal_fg }}
      ColorPalette={{ guacamole_terminal_palette | join(';') }}
      # A blinking cursor is a repaint twice a second that guacd re-encodes and
      # ships to the browser even on a completely idle desktop; a solid
      # background keeps the whole window a flat colour to compress.
      MiscCursorBlinks=FALSE
      BackgroundMode=TERMINAL_BACKGROUND_SOLID
      # Students paste multi-line command blocks out of the training docs all
      # day, and the confirmation dialog stops every single one of them.
      MiscShowUnsafePasteDialog=FALSE
      # Long enough to scroll back to the start of a kubectl describe.
      ScrollingLines=10000
      # Tabs and font zoom, reachable with the mouse. xfce4-terminal has had
      # both all along, but the desktop is displayed *inside a browser tab* by
      # Guacamole, and the browser claims their shortcuts first: Ctrl+Shift+T
      # reopens the last browser tab, Ctrl+plus/minus zooms the browser page.
      # Neither keystroke ever reaches the terminal, so a participant who does
      # not go hunting through the menus concludes the terminal cannot do it.
      # Hence: menubar always up (File > New Tab, View > Zoom In), and the tab
      # bar shown even with a single tab so its "+" button is on screen from
      # the start. Both are pinned rather than left to the upstream defaults,
      # which differ between versions. The keyboard path is restored separately
      # by the accels.scm below, and the menus advertise the new keys.
      MiscMenubarDefault=TRUE
      MiscAlwaysShowTabs=TRUE
      MiscTabCloseButtons=TRUE
      # Ctrl+mouse-wheel as a second way to resize the font, for the sessions
      # where the browser lets the combination through to the canvas.
      MiscMouseWheelZoom=TRUE
  when: guacamole_terminal_theme | bool

# ...and the keyboard path for the same two actions. GTK loads the accel map
# from the first xfce4/terminal/accels.scm found in $XDG_CONFIG_HOME then
# $XDG_CONFIG_DIRS, so /etc/xdg serves every account until someone edits a
# shortcut through the UI (which writes their own copy). See
# guacamole_terminal_accels for why the stock bindings had to be replaced.
- name: Rebind the terminal shortcuts the browser steals
  ansible.builtin.copy:
    dest: /etc/xdg/xfce4/terminal/accels.scm
    mode: "0644"
    content: |
      ; Managed by Ansible (guacamole role).
      {% for action, accel in guacamole_terminal_accels | dictsort %}
      (gtk_accel_path "<Actions>/terminal-window/{{ action }}" "{{ accel }}")
      {% endfor %}
  when:
    - guacamole_terminal_theme | bool
    - guacamole_terminal_accels | length > 0

# Same shadowing rule as terminalrc: xfce4-terminal writes its own
# ~/.config/xfce4/terminal/accels.scm the moment someone rebinds a key through
# Preferences > Shortcuts, and that copy then wins over /etc/xdg for good —
# later changes to the file above would be silently ignored for that account.
# (Closing the terminal alone does not create it: verified on 2026-08-05, the
# homes stayed clean across a full quit/relaunch cycle.) Drop the copies; they
# are regenerated from /etc/xdg at the next launch.
- name: Drop the per-user accel maps that shadow the system one
  ansible.builtin.file:
    path: "/home/{{ item }}/.config/xfce4/terminal/accels.scm"
    state: absent
  loop: "{{ guac_desktop_users | default([]) }}"
  when:
    - guacamole_terminal_theme | bool
    - guacamole_terminal_accels | length > 0
    - guacamole_reset_desktop_prefs | bool

# xrdp reads its TLS key as the 'xrdp' user; ssl-cert membership grants access.
- name: Ensure the xrdp user can read its TLS key
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: true
  notify: Restart xrdp

# Silence the recurring polkit "Authentication required to create a color
# managed device" popup that XFCE raises for every login.
- name: Suppress the colord authentication popup in the desktop
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/49-colord-no-auth.rules
    mode: "0644"
    content: |
      // Managed by Ansible (guacamole role).
      polkit.addRule(function(action, subject) {
          if (action.id == "org.freedesktop.color-manager.create-device" ||
              action.id == "org.freedesktop.color-manager.create-profile" ||
              action.id == "org.freedesktop.color-manager.delete-device" ||
              action.id == "org.freedesktop.color-manager.delete-profile" ||
              action.id == "org.freedesktop.color-manager.modify-device" ||
              action.id == "org.freedesktop.color-manager.modify-profile") {
              return polkit.Result.YES;
          }
      });

# The training kind clusters consume the default fs.inotify.max_user_instances,
# which then starves systemd's PID-file watch for xrdp ("Too many open files" ->
# xrdp.service fails despite the daemon listening fine). Raise the ceilings.
- name: Raise inotify limits (kind clusters + xrdp exhaust the defaults)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-guacamole-inotify.conf
    mode: "0644"
    content: |
      # Managed by Ansible (guacamole role).
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 1048576
  notify: Reload sysctl

# The new ceilings must be live *before* xrdp starts, so run the handler here
# instead of letting it wait for the end of the play.
- name: Apply the pending sysctl changes before starting xrdp
  ansible.builtin.meta: flush_handlers

- name: Enable and start xrdp (session manager first)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - xrdp-sesman
    - xrdp
