---
# Tunables for the optional Guacamole gateway (Docker stack). The master switch
# `guacamole_enabled` lives in group_vars/all/vars.yml (global default: off);
# flip it to true in a flavor's group_vars to deploy the stack there.

# Where the compose file, generated schema and seed SQL are written on the host.
guacamole_home: /opt/guacamole

# Pinned Guacamole release (web app + guacd share the same tag).
guacamole_version: "1.5.5"
guacamole_image: "guacamole/guacamole:{{ guacamole_version }}"
guacd_image: "guacamole/guacd:{{ guacamole_version }}"
guacamole_postgres_image: "postgres:15-alpine"

# Host port serving plain HTTP. Two meanings depending on guacamole_tls_enabled:
#   TLS off -> the web UI itself, at http://<server>:{{ guacamole_http_port }}/guacamole
#   TLS on  -> Caddy, which needs 80 for the ACME HTTP-01 challenge and to
#              redirect everything to HTTPS; the web app is no longer published.
# Default 80: the training tooling (ktbx/kubectl) grabs 8080, and a privileged
# port can't be hijacked by unprivileged student processes. Override if needed.
guacamole_http_port: 80

# --- HTTPS (Caddy + Let's Encrypt) --------------------------------------------
# The reason for TLS is not the padlock: Chrome and Firefox restrict the async
# Clipboard API to secure contexts, so copy-paste between the student's machine
# and the remote desktop only works over HTTPS — which matters a lot in a
# training where commands get pasted all day long.

# Public name Guacamole is served on. Injected by OpenTofu through the generated
# inventory (it owns the OVH DNS record pointing here), so the name is declared
# in exactly one place: the flavor's tfvars.
guacamole_fqdn: ""

# TLS follows the name, because a name is precisely what Let's Encrypt
# validates: there is nothing to decide separately. Force to false to serve
# plain HTTP on a host that does have a public name.
guacamole_tls_enabled: "{{ guacamole_fqdn | length > 0 }}"

# ACME account address, used by Let's Encrypt for expiry warnings only. Not a
# secret, so it belongs here rather than in the vault.
guacamole_acme_email: "fabrice.jammes@k8s-school.fr"

# Caddy is the TLS terminator: it does ACME, renewal, ARI, the 80 -> 443
# redirect and the WebSocket Upgrade pass-through with no configuration at all.
# That last point is what settles the choice — the Guacamole tunnel is a
# WebSocket, and it is the classic thing to get wrong with a hand-written nginx.
guacamole_caddy_image: "caddy:2-alpine"
guacamole_https_port: 443

# Auth database (Postgres). The password is internal-only: it never leaves the
# compose network, so a fixed local value is fine (not a training secret).
guacamole_db_name: guacamole
guacamole_db_user: guacamole
guacamole_db_password: "guacamole-internal"

# Web password for the built-in 'guacadmin' administrator. Reuses the (vaulted)
# trainer password so no new secret is needed — the trainer administers Guacamole.
guacamole_admin_password: "{{ trainer_password }}"

# What each auto-generated connection gives the participant:
#   rdp -> a full XFCE Linux desktop (browser included) via xrdp   [default]
#   ssh -> a plain terminal
# guacd reaches the host through the Docker host-gateway alias (see the compose
# file); RDP authenticates against the participant's own Unix password via PAM.
guacamole_protocol: "rdp"
guacamole_target_host: "host.docker.internal"
guacamole_rdp_port: 3389
guacamole_ssh_port: 22

# Embed each participant's password in their connection for one-click login.
# Set to false to have Guacamole prompt for it interactively.
guacamole_embed_password: true

# Keyboard layout guacd announces to xrdp, which then sets the X session's own
# layout to match. Left unset, guacd falls back to en-us-qwerty and the whole
# chain runs QWERTY: on a French keyboard AltGr+6 (the pipe) then arrives with
# AltGr held down while guacd tries to compose it as Shift+backslash, the two
# modifiers cancel out, and nothing is typed — with kubectl piped into grep all
# day, that is not a detail. Set to en-us-qwerty for a QWERTY audience; the
# keymaps guacd ships are listed in the Guacamole manual (RDP > server-layout).
guacamole_rdp_server_layout: "fr-fr-azerty"

# --- Latency / bandwidth tuning (rdp mode) ------------------------------------
# guacd decodes RDP server-side and re-encodes it for the browser, so every
# pixel the desktop redraws costs CPU *and* WAN bandwidth. The defaults below
# trade eye candy for responsiveness — the usual complaint is a slight input
# lag, and most of it comes from full-colour redraws plus XFCE compositing.
#
# Bits per pixel sent over RDP. 16 roughly halves the bitmap payload versus 24
# with no practical loss for a terminal/browser desktop. Must stay <= the
# max_bpp forced in xrdp.ini below.
guacamole_color_depth: "16"

# Ceiling xrdp advertises. Kept in sync with guacamole_color_depth so xrdp does
# not render at 32bpp only for guacd to downsample.
guacamole_xrdp_max_bpp: "16"

# Drop the RDP eye candy the server would otherwise have to paint and stream:
# wallpaper, window themes, font smoothing, live window dragging, compositing
# and menu animations. Set false to get the full-fat desktop back.
guacamole_rdp_lean_desktop: true

# XFCE ships with the xfwm4 compositor on, which forces full-screen redraws for
# shadows/transparency — the single biggest source of RDP sluggishness. This
# writes system-wide xfconf defaults turning it (and GTK animations) off.
guacamole_tune_xfce: true

# System-wide xfconf defaults only apply to accounts that have no per-user copy
# yet, and a participant who already opened a session has one. When true, those
# stale per-user xfwm4/xsettings files are removed so the tuned defaults win;
# only window-manager preferences are discarded, and XFCE regenerates them on
# the next login. Set false to leave existing sessions untouched.
guacamole_reset_desktop_prefs: true

# --- Desktop (rdp mode only) --------------------------------------------------
# Installed on the host so xrdp can hand each participant an XFCE session.
guacamole_desktop_packages:
  - xfce4
  - xfce4-terminal
  - xrdp
  - xorgxrdp
  - dbus-x11
  # Queried and driven by /usr/local/bin/layout.sh, which tiles the browser and
  # the terminal side by side: xdotool finds/moves/resizes windows, wmctrl
  # un-maximizes them first (a maximized window ignores a resize).
  - xdotool
  - wmctrl
# Browser students launch from the desktop. Pulled from Mozilla's APT repo (the
# Ubuntu 'firefox' package is a snap that doesn't run under xrdp).
guacamole_browser_package: firefox

# kind narrates cluster creation with emoji — "Ensuring node image 🖼",
# "Preparing nodes 📦", "Writing configuration 📜", "Starting control-plane 🕹️",
# "Installing CNI 🔌", "Installing StorageClass 💾", "Joining worker nodes 🚜",
# then "Thanks for using kind! 😊 Have a nice day! 👋". The Ubuntu server image
# carries no emoji font, so every one of them shows up as an empty tofu box in
# the desktop terminal — the first thing a student sees of kind looks broken.
# Installing Noto Color Emoji is the whole fix: its package drops a fontconfig
# rule making it the fallback for the monospace alias, so xfce4-terminal and
# VS Code's terminal both pick it up with no further configuration.
guacamole_desktop_fonts:
  - fonts-noto-color-emoji

# --- Terminal theme (rdp mode only) -------------------------------------------
# System-wide xfce4-terminal defaults, written to
# /etc/xdg/xfce4/terminal/terminalrc. The terminal is where the training
# actually happens, so it gets a readable dark theme — but nothing that costs a
# redraw over RDP: no transparency, no background image, no blinking cursor.
# xfce4-terminal only writes a per-user terminalrc once someone changes a
# setting in the UI, so unlike the xfconf defaults above this also reaches
# accounts that already opened a desktop. Set false to keep the stock look.
guacamole_terminal_theme: true

# Left on the fontconfig "Monospace" alias (DejaVu Sans Mono on Ubuntu): already
# installed, and it stays crisp with RDP font smoothing off.
guacamole_terminal_font: "Monospace 11"

guacamole_terminal_bg: "#1c1c1c"
guacamole_terminal_fg: "#d3d7cf"

# Tango palette — the XFCE/GNOME classic. Contrast is high enough to survive the
# 16 bpp RDP stream and a room projector, which the softer schemes (Nord,
# Solarized) are not. Normal colours 0-7 first, then the bright ones 8-15.
guacamole_terminal_palette:
  - "#2e3436" # black
  - "#cc0000" # red
  - "#4e9a06" # green
  - "#c4a000" # yellow
  - "#3465a4" # blue
  - "#75507b" # magenta
  - "#06989a" # cyan
  - "#d3d7cf" # white
  - "#555753" # bright black
  - "#ef2929" # bright red
  - "#8ae234" # bright green
  - "#fce94f" # bright yellow
  - "#729fcf" # bright blue
  - "#ad7fa8" # bright magenta
  - "#34e2e2" # bright cyan
  - "#eeeeec" # bright white

# Keyboard shortcuts written to /etc/xdg/xfce4/terminal/accels.scm (GTK accel
# map syntax). The stock ones are unusable here: the desktop is displayed inside
# a browser tab by Guacamole, and Chrome/Firefox reserve Ctrl+Shift+T (reopen
# closed browser tab) and Ctrl+plus/minus (zoom the page) at a level no web app
# can intercept — those keystrokes never reach the remote terminal at all.
#
# Same story for copy/paste: the terminal's Ctrl+Shift+C / Ctrl+Shift+V open the
# browser's element inspector instead.
#
# The bindings below were picked among the keys the browser does NOT claim, and
# verified through Guacamole on 2026-08-05: Alt+letter/Alt+symbol combinations
# reach the remote desktop intact, and the classic Ctrl+Insert / Shift+Insert
# pair is untouched by any browser. Everything remains
# reachable with the mouse too (menubar, tab bar "+", Ctrl+mouse wheel,
# select-to-copy then middle-click-to-paste), so this is the fast path, not the
# only one. Set to an empty dict to keep the stock accel map.
#
# Note this is the *desktop's* clipboard, shared between the remote Firefox and
# the remote terminal. Copying from the participant's own machine into the
# session is a Guacamole matter, not a terminal one: the browser only hands its
# clipboard to Guacamole over HTTPS, so on plain HTTP it goes through the
# Ctrl+Alt+Shift side panel.
guacamole_terminal_accels:
  # Tabs. Alt+N opens one, Alt+Page Up/Down walk left/right — the terminal
  # convention is Ctrl+Page Up/Down, but the browser uses that to switch its own
  # tabs. Function keys were the first attempt and had to be dropped: on a
  # laptop F2 needs the Fn key, which not every participant has to hand.
  #
  # N, not the obvious T: with the menubar visible, Alt+letter first matches a
  # menu mnemonic, and GTK gives the menu priority over the accelerator — Alt+T
  # just dropped down the Terminal menu. Whatever letter is used here must miss
  # every menu title in both locales the image can run in: F/E/V/T/B/H in
  # English, F/É/A/T/O/D in French.
  new-tab: "<Alt>n"
  prev-tab: "<Alt>Page_Up"
  next-tab: "<Alt>Page_Down"
  # Font size. Alt+= is the AZERTY-friendly twin of Alt+plus: on a French
  # keyboard "+" is Shift+"=", so the plain key sends "equal" and GTK would not
  # match the "plus" binding.
  zoom-in: "<Alt>plus"
  zoom-in-alt: "<Alt>equal"
  zoom-out: "<Alt>minus"
  zoom-reset: "<Alt>0"
  # Clipboard. Insert has no browser meaning at all, and Ctrl/Shift+Insert is
  # the pre-Ctrl+C convention every terminal already honours, so it is one less
  # thing to unlearn than an arbitrary function key.
  copy: "<Primary>Insert"
  paste: "<Shift>Insert"

# --- Welcome page (rdp mode only) ---------------------------------------------
# The shortcuts above are useless if nobody knows they exist, and a trainer
# repeating them at every session is the symptom. So they are also written to a
# local HTML page set as Firefox's home page — no network needed, and it is the
# first thing a participant sees when the desktop opens.
guacamole_welcome_page: true
guacamole_welcome_title: "Bienvenue sur votre bureau de formation"
guacamole_welcome_path: /usr/local/share/k8s-school/welcome.html

# The same page also gets a bookmark, first on the toolbar: the home page is
# only seen at startup, and a participant who has since browsed elsewhere needs
# a way back to it that does not involve retyping a file:// path.
guacamole_welcome_bookmark_title: "Aide & raccourcis"

# Drop Firefox's "Import bookmarks…" button from the toolbar. See the task for
# why it is a preference and not a policy — and note it only takes effect on a
# profile that does not exist yet.
guacamole_firefox_hide_import_button: true

# Which accels get a row on that page, in display order, with the wording the
# participants read. An action missing from guacamole_terminal_accels is simply
# skipped, so trimming the accel map never leaves a stale line behind.
guacamole_welcome_accel_labels:
  new-tab: "Ouvrir un nouvel onglet"
  next-tab: "Onglet suivant"
  prev-tab: "Onglet précédent"
  zoom-in: "Agrandir la police"
  zoom-in-alt: "Agrandir la police (variante AZERTY)"
  zoom-out: "Réduire la police"
  zoom-reset: "Revenir à la taille d'origine"
  copy: "Copier la sélection"
  paste: "Coller"

# Bookmarks pushed to every account's Firefox (students + trainer) through the
# enterprise policy file, so they appear on the bookmarks toolbar of a brand-new
# profile without touching anyone's places.sqlite. Placement is "toolbar" or
# "menu". Set to an empty list to ship no bookmarks.
#
# One folder per training track rather than a flat row: the toolbar stays
# readable, and a student hunting for "the OTel doc" opens one menu instead of
# scanning six titles. Firefox renders the entries in the order below, and each
# folder leads with our own lab — that is where a participant should land first,
# the upstream docs being the reference they fall back to.
guacamole_firefox_bookmarks:
  - Title: "K8s School"
    URL: "https://k8s-school.fr"
    Placement: "toolbar"

  - Title: "Labs Kubernetes"
    URL: "https://k8s-school.fr/labs/k8s"
    Folder: "Kubernetes"
    Placement: "toolbar"
  - Title: "Documentation Kubernetes"
    URL: "https://kubernetes.io/docs/home/"
    Folder: "Kubernetes"
    Placement: "toolbar"

  - Title: "Labs OpenTelemetry"
    URL: "https://k8s-school.fr/labs/otel"
    Folder: "OpenTelemetry"
    Placement: "toolbar"
  - Title: "Documentation OpenTelemetry"
    URL: "https://opentelemetry.io/docs/"
    Folder: "OpenTelemetry"
    Placement: "toolbar"
  - Title: "Démo OpenTelemetry"
    URL: "https://opentelemetry.io/docs/demo/"
    Folder: "OpenTelemetry"
    Placement: "toolbar"

# Keep the bookmarks toolbar visible, otherwise the entries above are hidden on
# a fresh profile. Applied as a *default* so a participant can still hide it.
guacamole_firefox_show_bookmarks_toolbar: true

# --- Live desktop sessions (rdp mode only) ------------------------------------
# Configuring xrdp restarts it, and a restart does NOT close the desktops it is
# serving: they survive orphaned, and xfce4-session then refuses to open a new
# one for the same account, locking the participant out until someone kills the
# leftovers by hand. So the role closes live sessions up front instead.
guacamole_close_live_sessions: true

# When sessions are found, the play pauses and lists the accounts about to be
# disconnected, so the operator can abort (Ctrl-C then A) rather than kick a
# class mid-exercise. Pass -e guacamole_session_reset_confirmed=true for
# unattended runs (CI, image bake, session bring-up before anyone connects).
guacamole_session_reset_confirmed: false

# --- SSH password authentication ----------------------------------------------
# Make the host's sshd accept password auth, in BOTH modes: required by guacd in
# ssh mode, and lets students/trainer SSH into the host directly with their
# training password in rdp mode. Set false to keep sshd key-only.
guacamole_enable_password_auth: true
