---
# Per-session participant provisioning. Idempotent replacement for
# bootstrap/adduser.sh + bootstrap/2_setup_home_dirs.sh.
#
# Unlike the bash version, homes are NOT wiped on re-run: the git role updates
# the clone in place, so a re-run is safe and keeps any gcloud login.

- name: Build participant list (name + index)
  ansible.builtin.set_fact:
    participants_all: >-
      {{ participants_all | default([])
         + [{'name': user_prefix ~ item, 'index': item}] }}
  loop: "{{ range(user_start | int, (nb_users | int) + 1) | list }}"

- name: Create participant accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ extra_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    # Per-user password "<index><suffix>", matching the old chpasswd logic.
    password: "{{ (item.index ~ participant_password) | password_hash('sha512', password_salt) }}"
  loop: "{{ participants_all }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure base home subdirectories
  ansible.builtin.file:
    path: "/home/{{ item.0.name }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0755"
  loop: "{{ participants_all | product(['.kube']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

- name: Clone / update the training repo for each participant
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.git:
    repo: "https://github.com/{{ github_org }}/{{ repo }}"
    dest: "/home/{{ item.name }}/{{ repo_dest }}"
    version: "{{ repo_version | default('HEAD') }}"
    update: true
  loop: "{{ participants_all }}"
  loop_control:
    label: "{{ item.name }}"

# Participants all use the same ports (8080 for the UIs, 8090 for their
# micro-service...): what makes them collision-free on a shared machine is the
# bind address, one loopback per account (student3 -> 127.0.0.3). The training
# scripts read PF_ADDR/PF_HOST and pass '--address $PF_ADDR' to port-forward.
- name: Set per-user training environment (CLUSTER_NAME + port-forward address)
  ansible.builtin.blockinfile:
    path: "/home/{{ item.name }}/.bashrc"
    marker: "# {mark} TRAINING ENV"
    block: |
      export CLUSTER_NAME={{ item.name }}
      export PF_ADDR=127.0.0.{{ item.index }}
      export PF_HOST=localhost{{ item.index }}
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
  loop: "{{ participants_all }}"
  loop_control:
    label: "{{ item.name }}"
  when: per_user_cluster | default(false)

# Makes 'http://localhost3:8080/' work in the browser (and in the URLs the
# training scripts print). The name says what the address is - a loopback of
# one's own - so a participant does not read it as another student's machine.
# Purely cosmetic: without it the address itself is still reachable, which is
# what scripts/env.sh falls back to.
- name: Name each participant's loopback address in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} TRAINING PARTICIPANT ADDRESSES"
    block: |
      {% for p in participants_all %}127.0.0.{{ p.index }} localhost{{ p.index }}
      {% endfor %}127.0.0.200 localhost200
  when: per_user_cluster | default(false)

# Accounts created above inherit this from /etc/skel (base_tools writes it into
# the image). The task is here for the homes that predate the prompt — a server
# booted on an older image, or re-provisioned for a second session.
- name: Source the shared prompt from each participant's .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ item.name }}/.bashrc"
    marker: "# {mark} TRAINING PROMPT"
    block: |
      if [ -r /etc/training-prompt.sh ]; then . /etc/training-prompt.sh; fi
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
  loop: "{{ participants_all }}"
  loop_control:
    label: "{{ item.name }}"

# The accounts above are created with a password, but Ubuntu's cloud images ship
# /etc/ssh/sshd_config.d/60-cloudimg-settings.conf with `PasswordAuthentication
# no`, so that password is unusable and participants get
# "Permission denied (publickey)". This used to be fixed only by the guacamole
# role, which left every flavor running without Guacamole — k8s, for one —
# handing out credentials nobody could use.
#
# 00- prefix because sshd keeps the FIRST value it reads for a keyword, and the
# drop-ins are included in lexicographic order: 00- wins over 60-cloudimg.
- name: Allow SSH password authentication for the participant accounts
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-training-passwordauth.conf
    mode: "0644"
    content: |
      # Managed by Ansible (participants role) — participants log in with the
      # password the trainer hands out, not with a key.
      PasswordAuthentication yes
    validate: "sshd -t -f %s"
  when: participants_enable_password_auth | default(true)
  notify: Restart sshd

# Apply now rather than at play end: the roles that follow may fail, and a
# participant locked out of the machine is the worst thing to leave behind.
- name: Apply the sshd change immediately
  ansible.builtin.meta: flush_handlers

# Fedora only: relabel docker-mounted dirs for SELinux (was chcon in adduser.sh).
- name: SELinux relabel of participant dirs
  community.general.sefcontext:
    target: "/home/{{ item.0.name }}/{{ item.1 }}(/.*)?"
    setype: svirt_sandbox_file_t
    state: present
  loop: "{{ participants_all | product(['.kube']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  when: selinux_relabel | default(false)
  notify: Restorecon homes
