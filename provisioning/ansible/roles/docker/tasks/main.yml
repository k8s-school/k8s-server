---
# docker-ce, installed cleanly and socket-activated.
# Encodes two bugs hit with the old bash flow:
#   - never install distro docker.io alongside docker-ce (breaks docker.service)
#   - start docker.socket before docker.service ("no sockets found" otherwise)
# For production, consider replacing this role with geerlingguy.docker.

- name: Install docker-ce (Debian/Ubuntu)
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Ensure conflicting distro packages are absent
      ansible.builtin.apt:
        name: [docker.io, docker-engine, containerd, runc]
        state: absent

    # deb822_repository needs the python3-debian library on the target.
    - name: Ensure python3-debian is present
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add Docker apt repository (deb822, fetches the signing key)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/ubuntu"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        signed_by: "https://download.docker.com/linux/ubuntu/gpg"
        state: present

    - name: Install docker-ce packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Install docker (Fedora/RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name: [docker, lsb_release]
    state: present

# Docker 29 enables the containerd image store by default on fresh installs.
# `docker save` then emits an OCI *index* covering every architecture of a
# multi-arch image, while only shipping the blobs of the local platform. kind
# pipes that tar into `ctr images import --all-platforms`, which tries to
# resolve the other architectures and dies with:
#   ctr: content digest sha256:...: not found
# That breaks the image preloading in the otel repo's up.sh for every student.
# Reproduced on 2026-07-27 with kind 0.27 AND 0.30, so it is the store, not kind.
# Pin the classic overlay2 store, which is what working local setups still use.
- name: Keep the classic overlay2 image store (kind cannot load from containerd)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "features": {
          "containerd-snapshotter": false
        }
      }
  notify: Restart docker

# The daemon must already run on overlay2 before anything pulls images.
- name: Apply the daemon configuration before using docker
  ansible.builtin.meta: flush_handlers

# Socket first, then the service — the ordering that was missing in bash.
- name: Enable and start docker.socket
  ansible.builtin.systemd:
    name: docker.socket
    enabled: true
    state: started

- name: Enable and start docker.service
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started
