---
# OpenShift Local (crc) for the openshift flavor, run by the trainer account.
# Port of bootstrap/fedora/crc-setup.sh + crc-start.sh + openshift-tools.sh.
# One crc VM per server: it alone takes crc_cpus / crc_memory_mb.

- name: Look up the trainer uid (for its systemd user runtime dir)
  ansible.builtin.getent:
    database: passwd
    key: "{{ trainer_user }}"

- name: Set the crc paths and environment
  ansible.builtin.set_fact:
    training_crc_home: "/home/{{ trainer_user }}"
    training_crc_bin: "/home/{{ trainer_user }}/bin/crc"
    # crc setup drives systemd *user* units: without these two variables it dies
    # with "Failed to connect to user scope bus" over a non-login shell.
    training_crc_env:
      PATH: "/home/{{ trainer_user }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[trainer_user][1] }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd[trainer_user][1] }}/bus"

# The pull secret is personal to a Red Hat account, hence gitignored: the
# operator drops it at the repo root, as infra/start.sh expected.
- name: Check the crc pull secret is present on the operator machine
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ crc_pull_secret_src }}"
  register: training_crc_pull_secret

- name: Fail early without a pull secret (crc start would prompt for it)
  ansible.builtin.fail:
    msg: >-
      {{ crc_pull_secret_src }} not found. Download it from
      https://console.redhat.com/openshift/create/local and save it there.
  when: not training_crc_pull_secret.stat.exists

- name: Copy the crc pull secret into the trainer home
  ansible.builtin.copy:
    src: "{{ crc_pull_secret_src }}"
    dest: "{{ training_crc_home }}/pull-secret.txt"
    owner: "{{ trainer_user }}"
    group: "{{ trainer_user }}"
    mode: "0600"

- name: Create the trainer bin dir
  ansible.builtin.file:
    path: "{{ training_crc_home }}/bin"
    state: directory
    owner: "{{ trainer_user }}"
    group: "{{ trainer_user }}"
    mode: "0755"

- name: Download and unpack crc {{ crc_version }}
  become: true
  become_user: "{{ trainer_user }}"
  ansible.builtin.unarchive:
    src: "https://mirror.openshift.com/pub/openshift-v4/clients/crc/{{ crc_version }}/crc-linux-amd64.tar.xz"
    dest: "{{ training_crc_home }}"
    remote_src: true
    creates: "{{ training_crc_home }}/crc-linux-{{ crc_version }}-amd64/crc"

- name: Link crc into the trainer PATH
  ansible.builtin.file:
    src: "{{ training_crc_home }}/crc-linux-{{ crc_version }}-amd64/crc"
    dest: "{{ training_crc_bin }}"
    state: link
    owner: "{{ trainer_user }}"
    group: "{{ trainer_user }}"

# Starts the trainer's systemd user instance now and at every boot.
- name: Enable linger for the trainer
  ansible.builtin.command: loginctl enable-linger {{ trainer_user }}
  args:
    creates: "/var/lib/systemd/linger/{{ trainer_user }}"

- name: Wait for the trainer user bus
  ansible.builtin.wait_for:
    path: "{{ training_crc_env.XDG_RUNTIME_DIR }}/bus"
    timeout: 60

- name: Configure crc
  become: true
  become_user: "{{ trainer_user }}"
  environment: "{{ training_crc_env }}"
  ansible.builtin.command: "{{ training_crc_bin }} config set {{ item.key }} {{ item.value }}"
  loop: "{{ crc_config | dict2items }}"
  changed_when: false

- name: Run crc setup (installs libvirt, downloads the bundle)
  become: true
  become_user: "{{ trainer_user }}"
  environment: "{{ training_crc_env }}"
  ansible.builtin.command: "{{ training_crc_bin }} setup"
  # Downloads and unpacks the ~5 GB bundle: do not hold the SSH session on it.
  async: 3600
  poll: 30
  changed_when: false

- name: Enable and start libvirtd
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true
    state: started

- name: Read the crc status
  become: true
  become_user: "{{ trainer_user }}"
  environment: "{{ training_crc_env }}"
  ansible.builtin.command: "{{ training_crc_bin }} status -o json"
  register: training_crc_status
  changed_when: false
  failed_when: false

# Docker (29) sets the FORWARD policy to DROP and only lets its own bridges
# through: the crc VM's traffic on the libvirt bridge is dropped before the
# libvirt NAT, the cluster reaches nothing outside and every image pull times
# out (ImagePullBackOff). Let that one bridge through in DOCKER-USER, the chain
# Docker leaves to the admin, and keep the DROP policy for everything else.
# A unit rather than one-off rules: iptables rules do not survive a reboot, and
# WantedBy=docker.service re-applies them whenever Docker (re)starts.
- name: Install the unit letting the crc bridge through Docker's FORWARD DROP
  ansible.builtin.copy:
    dest: /etc/systemd/system/crc-forward.service
    mode: "0644"
    content: |
      # Managed by Ansible (training role, crc.yml).
      [Unit]
      Description=Let the crc libvirt bridge through Docker's FORWARD DROP
      After=docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # -C first: idempotent when Docker kept the rules across a restart.
      ExecStart=/bin/sh -c 'iptables -C DOCKER-USER -i crc -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -i crc -j ACCEPT'
      ExecStart=/bin/sh -c 'iptables -C DOCKER-USER -o crc -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER -o crc -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT'
      ExecStop=-iptables -D DOCKER-USER -i crc -j ACCEPT
      ExecStop=-iptables -D DOCKER-USER -o crc -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      [Install]
      WantedBy=docker.service
  register: training_crc_forward_unit

- name: Enable and start the crc forwarding unit
  ansible.builtin.systemd:
    name: crc-forward.service
    enabled: true
    state: "{{ 'restarted' if training_crc_forward_unit is changed else 'started' }}"
    daemon_reload: "{{ training_crc_forward_unit is changed }}"

# The first start takes 10-20 min: run it async so the SSH session is not held.
- name: Start crc
  become: true
  become_user: "{{ trainer_user }}"
  environment: "{{ training_crc_env }}"
  ansible.builtin.command: "{{ training_crc_bin }} start"
  async: 3600
  poll: 30
  changed_when: true
  # A regex rather than from_json: before the first start, crc status may print
  # nothing parseable at all.
  when: training_crc_status.stdout is not search('"openshiftStatus":\\s*"Running"')

- name: Install oc system-wide (shipped with the crc bundle)
  ansible.builtin.copy:
    src: "{{ training_crc_home }}/.crc/bin/oc/oc"
    dest: /usr/local/bin/oc
    remote_src: true
    mode: "0755"

# The console, the OAuth server and every route are served with a certificate
# signed by the ingress operator's self-signed CA: trusted by nothing, hence a
# warning on each first visit. Add it to the system trust (curl, oc) and leave
# it where the guacamole role points Firefox (guacamole_firefox_certificates).
- name: Read the crc ingress CA
  ansible.builtin.command: >-
    /usr/local/bin/oc --kubeconfig {{ training_crc_home }}/.crc/machines/crc/kubeconfig
    -n openshift-ingress-operator get secret router-ca
    -o 'jsonpath={.data.tls\.crt}'
  register: training_crc_ingress_ca
  changed_when: false
  # Unquoted, the argument splitting eats the backslash: oc then gets
  # {.data.tls.crt}, matches nothing and prints an empty, successful result.
  failed_when: training_crc_ingress_ca.rc != 0 or training_crc_ingress_ca.stdout | length == 0

- name: Trust the crc ingress CA system-wide
  ansible.builtin.copy:
    dest: "{{ crc_ingress_ca_path }}"
    mode: "0644"
    content: "{{ training_crc_ingress_ca.stdout | b64decode }}"
  register: training_crc_ca_file

- name: Rebuild the system trust store
  ansible.builtin.command: update-ca-trust
  when: training_crc_ca_file is changed
  changed_when: true

- name: Download and unpack oc-mirror {{ ocp_version }}
  ansible.builtin.unarchive:
    src: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ ocp_version }}/oc-mirror.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    creates: /usr/local/bin/oc-mirror

# oc-mirror is linked against libgpgme.so.11, Fedora ships libgpgme.so.45: same
# API, so point the old soname at it (bootstrap/fedora/openshift-tools.sh did).
- name: Provide the libgpgme soname oc-mirror is linked against
  ansible.builtin.file:
    src: "{{ crc_libgpgme }}"
    dest: /usr/lib64/libgpgme.so.11
    state: link
