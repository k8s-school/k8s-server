---
# Per-session trainer account. One shared 'trainer' user across every flavor,
# with passwordless sudo and docker access, plus a clone of the flavor's
# advanced repo (k8s-advanced / openshift-advanced / otel) in its home.

- name: Create the trainer account
  ansible.builtin.user:
    name: "{{ trainer_user }}"
    groups: "{{ trainer_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    # Optional password so the trainer can log in over SSH; sudo is passwordless
    # regardless (see the sudoers task below).
    password: "{{ trainer_password | password_hash('sha512', password_salt) if trainer_password else omit }}"

- name: Grant the trainer passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ trainer_user }}"
    mode: "0440"
    content: "{{ trainer_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"

# Pre-create the become_user's tmp dir so the git task (run as trainer) doesn't
# race Ansible into creating ~/.ansible/tmp on the fly (the 0700 remote_tmp
# WARNING).
- name: Ensure the trainer Ansible tmp dir exists
  ansible.builtin.file:
    path: "/home/{{ trainer_user }}/.ansible/tmp"
    state: directory
    owner: "{{ trainer_user }}"
    group: "{{ trainer_user }}"
    mode: "0700"

# Same as for the participants: /etc/skel covers a freshly created account, this
# covers a home that predates the prompt.
- name: Source the shared prompt from the trainer's .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ trainer_user }}/.bashrc"
    marker: "# {mark} TRAINING PROMPT"
    block: |
      if [ -r /etc/training-prompt.sh ]; then . /etc/training-prompt.sh; fi
    owner: "{{ trainer_user }}"
    group: "{{ trainer_user }}"

# Same block as the participants get, with the address /etc/hosts already
# reserves for the trainer: 127.0.0.200, out of the student range, because the
# instructor demoes on the same machine as student1 who owns 127.0.0.1.
# scripts/env.sh derives the very same values from the login name, so this is
# belt and braces - but it keeps the answer in one place, next to the
# /etc/hosts entry, rather than only in the training repo.
- name: Set the trainer training environment (CLUSTER_NAME + port-forward address)
  ansible.builtin.blockinfile:
    path: "/home/{{ trainer_user }}/.bashrc"
    marker: "# {mark} TRAINING ENV"
    block: |
      export CLUSTER_NAME={{ trainer_user }}
      export PF_ADDR=127.0.0.200
      export PF_HOST=localhost200
    owner: "{{ trainer_user }}"
    group: "{{ trainer_user }}"
  when: per_user_cluster | default(false)

- name: Clone / update the trainer repo
  become: true
  become_user: "{{ trainer_user }}"
  ansible.builtin.git:
    repo: "https://github.com/{{ github_org }}/{{ trainer_repo }}.git"
    dest: "/home/{{ trainer_user }}/{{ trainer_repo }}"
    version: "{{ trainer_repo_version | default('HEAD') }}"
    update: true
