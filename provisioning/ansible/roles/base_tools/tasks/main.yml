---
# System-wide training tooling in /usr/local/bin. Baked into the image.
# Replaces bootstrap/install-go.sh, install-godeps.sh and the ktbx installs.
# All tasks are idempotent (creates=/check before download) so re-running is cheap.

- name: Install base OS packages
  ansible.builtin.package:
    name: [git, curl, bash-completion, jq, tree]
    state: present

- name: Install Go
  ansible.builtin.unarchive:
    src: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: true
    creates: /usr/local/go/bin/go

# ktbx (k8s-school toolbox) — installed first so it can provision kubectl/helm
# below. TODO: pin to a release asset instead of building.
- name: Install ktbx
  ansible.builtin.shell: |
    set -euo pipefail
    go install github.com/k8s-school/ktbx@latest
    install -m 0555 "$(go env GOPATH)/bin/ktbx" /usr/local/bin/ktbx
  args:
    creates: /usr/local/bin/ktbx
    executable: /bin/bash # pipefail is a bashism; default /bin/sh (dash) rejects it
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_facts['env'].PATH }}"

# kubectl + helm + kind all come from ktbx (same tool + pinned versions as the
# k8s-school CI stack: kubectl v1.30.0, helm v3.16.2, kind v0.31.0). ktbx installs
# into /usr/local/bin (system-wide) and is version-idempotent; the `creates`
# guard also skips the task once the binary exists.
- name: Install kubectl (via ktbx)
  ansible.builtin.command: /usr/local/bin/ktbx install kubectl
  args:
    creates: /usr/local/bin/kubectl

- name: Install helm (via ktbx)
  ansible.builtin.command: /usr/local/bin/ktbx install helm
  args:
    creates: /usr/local/bin/helm

- name: Install kind (via ktbx)
  ansible.builtin.command: /usr/local/bin/ktbx install kind
  args:
    creates: /usr/local/bin/kind

# ink — k8s-school's assertion helper. Not a convenience: the k8s-advanced and
# finops labs call it directly (labs/2_authorization/ci.sh and friends), so
# without it their CI scripts fail on the very first step. Same install pattern
# as ktbx above, and pinned to the version those labs' own CI installs.
- name: Install ink
  ansible.builtin.shell: |
    set -euo pipefail
    go install github.com/k8s-school/ink@{{ ink_version }}
    install -m 0555 "$(go env GOPATH)/bin/ink" /usr/local/bin/ink
  args:
    creates: /usr/local/bin/ink
    executable: /bin/bash
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_facts['env'].PATH }}"

# --- Client tooling formerly provided by the `ktbx desk` container ------------
# See group_vars/all/vars.yml for why these moved onto the host. Same pattern as
# Go above: pinned release tarball, extracted straight into /usr/local/bin, with
# `creates` making a re-run a no-op. `include` pulls only the binary out of the
# archive, leaving the LICENSE/README the upstream tarballs also ship.

- name: Install the shell tools the toolbox provided
  ansible.builtin.package:
    name: [zsh, vim, nano, parallel]
    state: present

- name: Install kubectx and kubens
  ansible.builtin.unarchive:
    src: "https://github.com/ahmetb/kubectx/releases/download/{{ kubectx_version }}/{{ item }}_{{ kubectx_version }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: ["{{ item }}"]
    creates: "/usr/local/bin/{{ item }}"
  loop: [kubectx, kubens]

- name: Install kustomize
  ansible.builtin.unarchive:
    # The tag is 'kustomize/vX.Y.Z' — the slash is URL-encoded in the asset path.
    src: "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F{{ kustomize_version }}/kustomize_{{ kustomize_version }}_linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [kustomize]
    creates: /usr/local/bin/kustomize

- name: Install stern
  ansible.builtin.unarchive:
    # Tag carries the leading 'v', the asset filename does not.
    src: "https://github.com/stern/stern/releases/download/{{ stern_version }}/stern_{{ stern_version | replace('v', '') }}_linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [stern]
    creates: /usr/local/bin/stern

- name: Install k9s
  ansible.builtin.unarchive:
    src: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [k9s]
    creates: /usr/local/bin/k9s

# The ~800 generated kubectl aliases (k, kg, kgpo, kdel...) the toolbox sourced
# from its .bashrc. Dropped in bash_completion.d for the same reason as the
# completion scripts below: that directory is the only one bash sources for the
# interactive non-login shells the XFCE terminal spawns.
- name: Install the kubectl aliases
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ahmetb/kubectl-aliases/master/.kubectl_aliases
    dest: /etc/bash_completion.d/kubectl_aliases
    mode: "0644"

# The toolbox shipped its own /opt/bin on the PATH; clone-school.sh is the one
# script from it still worth having — it clones/updates the four training repos
# into $HOME. /usr/local/bin is already on every account's PATH, so it needs no
# profile edit to be reachable.
- name: Install clone-school.sh
  ansible.builtin.copy:
    src: clone-school.sh
    dest: /usr/local/bin/clone-school.sh
    mode: "0755"

# --- Google Cloud SDK ---------------------------------------------------------
# Used by the GCP labs. Debian/Ubuntu only: the Fedora flavor (openshift) runs
# crc locally and has no GCP lab, so its yum counterpart is deliberately absent
# rather than shipped untested.
- name: Add the Google Cloud apt repository (deb822, fetches the signing key)
  ansible.builtin.deb822_repository:
    name: google-cloud-sdk
    types: [deb]
    uris: "https://packages.cloud.google.com/apt"
    suites: [cloud-sdk]
    components: [main]
    architectures: [amd64]
    signed_by: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
    state: present
  when: ansible_facts['os_family'] == "Debian"

# state: latest, not present — gcloud warns on every invocation once it lags
# behind, and the image is the one place where catching up is free. Same policy
# as the dist-upgrade in image.yml: update once at bake time, then the frozen
# updaters keep it still for the whole session.
- name: Install the Google Cloud CLI # noqa: package-latest
  ansible.builtin.apt:
    name: google-cloud-cli
    state: latest
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

# System-wide bash completion for every account, incl. users created later.
# Must run after the binaries above: the scripts are generated from them, so a
# tooling upgrade regenerates a matching completion (copy compares the content).
#
# /etc/bash_completion.d/ — NOT /etc/profile.d/ — is what makes this work in the
# Guacamole desktop: profile.d is only sourced by *login* shells, and the XFCE
# terminal spawns an interactive non-login bash, so completion was silently
# missing there while it worked over SSH. bash-completion (installed above) is
# loaded from /etc/bash.bashrc for every interactive shell and sources this
# directory. Static files also drop the per-shell `source <(kubectl completion
# bash)` fork, and with it the dash-syntax-error footgun that once blanked the
# XFCE session.
- name: Generate the kubectl and helm bash completion scripts
  ansible.builtin.command: "/usr/local/bin/{{ item }} completion bash"
  register: base_tools_completion
  changed_when: false
  loop: [kubectl, helm]

- name: Install the completion scripts system-wide
  ansible.builtin.copy:
    dest: "/etc/bash_completion.d/{{ item.item }}"
    content: "{{ item.stdout }}\n"
    mode: "0644"
  loop: "{{ base_tools_completion.results }}"
  loop_control:
    label: "{{ item.item }}"

# Superseded by the files above; remove it so completion is not loaded twice
# (and so the process-substitution version stops running in login shells).
- name: Remove the old profile.d completion drop-in
  ansible.builtin.file:
    path: /etc/profile.d/kubectl-helm-completion.sh
    state: absent

# --- Shell prompt -------------------------------------------------------------
# The prompt logic lives in one file that every account sources, so tweaking it
# later is a single edit rather than a rewrite of everyone's .bashrc.
#
# It cannot be installed the way the completion above is: /etc/bash.bashrc (and
# anything it sources) runs BEFORE ~/.bashrc, and the distro ~/.bashrc assigns
# PS1 unconditionally — it would win every time. Hence the source line appended
# to the end of each .bashrc, in /etc/skel for the accounts site.yml creates and
# in the existing homes by the participants/trainer roles.
- name: Install the shared shell prompt
  ansible.builtin.copy:
    dest: /etc/training-prompt.sh
    mode: "0644"
    content: |
      # Managed by Ansible (base_tools role). Sourced from every account's .bashrc.
      #
      # One line, coloured. Colour makes it obvious where one command's output
      # ends and the next prompt begins — the usual confusion when a student
      # pastes a block of commands out of the training docs.
      #
      # The width problem that a cwd like ~/k8s-basics/exercises/otel/step3 used
      # to cause is handled by PROMPT_DIRTRIM rather than by a second prompt
      # line: bash elides the leading components itself (.../otel/step3), so the
      # command keeps most of the width without costing a line on every prompt.
      #
      # Deliberately plain: no git branch, no kubectl context. Both mean forking a
      # process (or reading ~/.kube/config) before every single prompt, on a box
      # already running everyone's kind clusters.

      # Interactive shells only, and only where colour means anything.
      case $- in *i*) ;; *) return ;; esac
      case ${TERM:-dumb} in dumb) return ;; esac

      if [ "$(id -u)" -eq 0 ]; then
          __training_who='\[\e[1;31m\]'   # root in red: you are not a participant
      else
          __training_who='\[\e[1;32m\]'
      fi

      # Keep the last two components of the cwd; bash renders the rest as "...".
      PROMPT_DIRTRIM=2

      # Single quotes on the tail so \$ reaches PS1 intact (it renders as $, or #
      # for root) instead of being eaten by the double quotes.
      PS1="${__training_who}\u@\h\[\e[0m\] \[\e[1;34m\]\w\[\e[0m\]"' \$ '
      unset __training_who

      # Keep the window/tab title the distro prompt used to set.
      case ${TERM} in
          xterm*|rxvt*) PS1="\[\e]0;\u@\h: \w\a\]${PS1}" ;;
      esac

- name: Source the shared prompt from the skeleton .bashrc
  ansible.builtin.blockinfile:
    path: /etc/skel/.bashrc
    marker: "# {mark} TRAINING PROMPT"
    block: |
      if [ -r /etc/training-prompt.sh ]; then . /etc/training-prompt.sh; fi

# VS Code — graphical editor for the XFCE/Guacamole desktops. It's Electron, so
# each running instance costs ~300-600 MB RAM; on GP1-M (8 vCPU / 32 GB) that's
# fine for the 4-5 concurrent session accounts (kind + Docker are the real RAM
# sink, not the editors). Pulled from Microsoft's own repo so it stays a normal
# apt/dnf package rather than a snap (snaps don't run under xrdp — see image.yml).

# --- Debian/Ubuntu ---
# deb822_repository needs the python3-debian library on the target. The docker
# role installs it too, but repeat it here so base_tools stays self-contained
# whatever the role order in image.yml.
- name: Ensure python3-debian is present
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Add VS Code apt repository (deb822, fetches the signing key)
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: "https://packages.microsoft.com/repos/code"
    suites: [stable]
    components: [main]
    architectures: [amd64, arm64, armhf]
    signed_by: "https://packages.microsoft.com/keys/microsoft.asc"
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Install VS Code (Debian/Ubuntu)
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

# --- Fedora ---
- name: Import Microsoft RPM key for VS Code (Fedora)
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Add VS Code yum repository (Fedora)
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install VS Code (Fedora)
  ansible.builtin.dnf:
    name: code
    state: present
  when: ansible_facts['os_family'] == "RedHat"

# Default settings baked into /etc/skel so every session account created later by
# site.yml inherits them: kill telemetry, and pin update.mode=none so VS Code
# never self-updates mid-session (same freeze policy as the apt updaters in
# image.yml). Users can still tweak their own copy afterwards.
- name: Create VS Code config directory in /etc/skel
  ansible.builtin.file:
    path: /etc/skel/.config/Code/User
    state: directory
    mode: "0755"

- name: Provide default VS Code settings for all future users
  ansible.builtin.copy:
    dest: /etc/skel/.config/Code/User/settings.json
    mode: "0644"
    content: |
      {
        "telemetry.telemetryLevel": "off",
        "update.mode": "none",
        "workbench.startupEditor": "none"
      }
