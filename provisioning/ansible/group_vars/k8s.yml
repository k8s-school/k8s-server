# Kubernetes training: shared studentN accounts; the instructor uses the
# dedicated 'trainer' account (user_prefix/user_start inherited from all/vars.yml).
repo: "k8s-school"
repo_dest: ".ktbx/homefs/k8s-school"
# Trainer gets the advanced course repo (k8s-school/k8s-advanced).
trainer_repo: "k8s-advanced"
extra_groups: ["docker", "adm"]

per_user_cluster: false

# Instructor cluster created at session time (participants create their own).
training_action: "ktbx_create"
