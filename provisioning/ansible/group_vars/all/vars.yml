# Shared defaults for every flavor. Override per-flavor in group_vars/<flavor>.yml.
# Secrets live encrypted in vault.yml (same directory); the vault_* vars are
# referenced from here so playbooks/roles only ever see the friendly names.

# Participant accounts, named "<user_prefix><index>", the same on every flavor:
# 'student' accounts for the students, plus the dedicated 'trainer' account below
# for the instructor (no more <prefix>0 instructor). Override per flavor only if
# a flavor genuinely needs different numbering.
user_prefix: "student"
user_start: 1

# Number of participant accounts (mirrors NB_USER in bootstrap/env.sh).
nb_users: 30

# Password suffix; per-user password is "<index><participant_password>", matching
# the chpasswd logic in bootstrap/adduser.sh. Value is vaulted (see vault.yml).
participant_password: "{{ vault_participant_password }}"

# Fixed salt for password_hash() so account passwords hash identically on every
# run (idempotent). Vaulted alongside the passwords.
password_salt: "{{ vault_password_salt }}"

# Pinned tooling versions (baked by base_tools). Keep in sync with bootstrap/.
# kubectl, helm and kind versions are owned by ktbx (ktbx install ...) to match
# the k8s-school CI stack; only Go is pinned here.
go_version: "1.23.0"

# Client-side tooling that used to live in the `ktbx desk` container image
# (ktbx/_desk/Dockerfile). The container was there to give a homogeneous
# environment on a heterogeneous client laptop; on a training server booted from
# a baked image that job is already done, so the tools are installed on the host
# instead — one environment for the XFCE desktop, VS Code and the terminal alike.
kubectx_version: "v0.11.0"
kustomize_version: "v5.8.1"
stern_version: "v1.34.0"
k9s_version: "v0.51.0"
# Pinned to the version the k8s-advanced CI itself installs.
ink_version: "v0.0.1-rc3"
# RBAC auditing tools used by the "find the RBAC security issue" lab
# (labs/2_authorization/sec-issue.sh + the RBAC deck).
kubescape_version: "4.0.13"
# rakkess is built from source (see base_tools): the published v0.5.0 binary is
# too old to enumerate the API of a current Kubernetes, while this same tag
# builds and works.
rakkess_version: "0.5.1"

github_org: "k8s-school"

# Shared trainer account (created on every flavor by the trainer role):
# passwordless sudo + docker access. trainer_repo is set per flavor.
trainer_user: "trainer"
# Just docker here; adm is absent on Fedora (openshift). sudo comes from the
# dedicated sudoers.d drop-in, not group membership.
trainer_groups: ["docker"]
# Login password for the trainer (vaulted). sudo is passwordless independently.
trainer_password: "{{ vault_trainer_password }}"

# Optional Apache Guacamole gateway (Docker stack) giving participants
# browser-based SSH access to this server, one auto-generated connection each.
# Off by default; flip to true in a flavor's group_vars to deploy it there.
# Per-role tunables (version, port, images) live in roles/guacamole/defaults.
guacamole_enabled: false
