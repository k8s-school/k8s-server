# OpenShift training: shared studentN accounts on Fedora, crc-based; the
# instructor uses the dedicated 'trainer' account (user_prefix/user_start
# inherited from all/vars.yml).
repo: "openshift-advanced"
repo_dest: "openshift-advanced"
# Trainer gets the same advanced course repo (k8s-school/openshift-advanced).
trainer_repo: "openshift-advanced"
# Fedora has no adm group by default; SELinux relabel handled in participants role.
extra_groups: ["docker"]
selinux_relabel: true

per_user_cluster: false

training_action: "crc"

# crc (OpenShift Local), run by the trainer account — see roles/training/tasks/crc.yml.
# Versions were in bootstrap/env.sh.
crc_version: "2.61.0"
ocp_version: "4.21.19"
# Fedora 44 library that oc-mirror gets as libgpgme.so.11.
crc_libgpgme: /usr/lib64/libgpgme.so.45
# Gitignored, personal to a Red Hat account: dropped at the repo root by the operator.
crc_pull_secret_src: "{{ playbook_dir }}/../../pull-secret.txt"
crc_config:
  preset: openshift
  # 'user' (the default) runs the VM behind gvproxy and makes crc itself listen
  # on the server's 80 and 443, on every interface: it collides with Guacamole
  # and publishes the console. 'system' puts the VM on a libvirt bridge and lets
  # NetworkManager's dnsmasq resolve *.apps-crc.testing to it, binding nothing.
  # Changing it on an existing VM takes 'crc delete' + 'crc cleanup' first.
  network-mode: system
  # Unset, crc setup asks the question on a terminal.
  consent-telemetry: "no"
  cpus: 7
  memory: 24576
  # Monitoring needs at least 14 GiB of memory on its own.
  enable-cluster-monitoring: "false"
  disk-size: 50
  pull-secret-file: "/home/{{ trainer_user }}/pull-secret.txt"

# Deploy the optional Guacamole gateway on this flavor. No dns_zone in
# tofu/envs/openshift.tfvars, so it is served over plain HTTP on port 80.
# crc is not exposed outside the server: the console and the API are used from
# it (*.apps-crc.testing and api.crc.testing only resolve there), through the
# Firefox of each participant's XFCE desktop (rdp mode, the default).
guacamole_enabled: true

# Written by roles/training/tasks/crc.yml from the cluster's router-ca secret.
crc_ingress_ca_path: /etc/pki/ca-trust/source/anchors/crc-ingress-ca.crt
# Same, for the API signers (from crc's admin kubeconfig), so 'oc login' works.
crc_api_ca_path: /etc/pki/ca-trust/source/anchors/crc-api-ca.crt

# Docker Hub cache for every kind cluster of the server (roles/registry_mirror),
# preloaded with the Docker Hub images of the labs. The crc VM does not use it:
# a single node pulling each image once stays far below the rate limit.
registry_mirror_enabled: true
registry_mirror_preload:
  - docker.io/envoyproxy/envoy:distroless-v1.38.1
  - docker.io/envoyproxy/gateway:v1.8.1
  - docker.io/grafana/grafana:11.5.1
  - docker.io/library/busybox:1.36
  - docker.io/library/busybox:1.37.0
  - docker.io/library/busybox:latest
  - docker.io/luksa/kubia:latest
  - docker.io/luksa/memoryhog:latest
  - docker.io/nginxinc/nginx-unprivileged:alpine
  - docker.io/nginxinc/nginx-unprivileged:alpine3.22-perl
  - docker.io/vish/stress:latest

guacamole_firefox_certificates:
  - "{{ crc_ingress_ca_path }}"
# Replaces the shared list (roles/guacamole/defaults): its OpenTelemetry folder
# has nothing to do here.
guacamole_firefox_bookmarks:
  - Title: "K8s School"
    URL: "https://k8s-school.fr"
    Placement: "toolbar"

  - Title: "Labs Kubernetes"
    URL: "https://k8s-school.fr/labs/k8s"
    Folder: "Kubernetes"
    Placement: "toolbar"
  - Title: "Documentation Kubernetes"
    URL: "https://kubernetes.io/docs/home/"
    Folder: "Kubernetes"
    Placement: "toolbar"

  - Title: "Console OpenShift"
    URL: "https://console-openshift-console.apps-crc.testing"
    Folder: "OpenShift"
    Placement: "toolbar"
  - Title: "Documentation OpenShift"
    URL: "https://docs.redhat.com/en/documentation/openshift_container_platform/"
    Folder: "OpenShift"
    Placement: "toolbar"
