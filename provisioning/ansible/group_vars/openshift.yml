# OpenShift training: shared studentN accounts on Fedora, crc-based; the
# instructor uses the dedicated 'trainer' account (user_prefix/user_start
# inherited from all/vars.yml).
repo: "openshift-advanced"
repo_dest: "openshift-advanced"
# Trainer gets the same advanced course repo (k8s-school/openshift-advanced).
trainer_repo: "openshift-advanced"
# Fedora has no adm group by default; SELinux relabel handled in participants role.
extra_groups: ["docker"]
selinux_relabel: true

per_user_cluster: false

training_action: "crc"

# crc (OpenShift Local), run by the trainer account — see roles/training/tasks/crc.yml.
# Versions were in bootstrap/env.sh.
crc_version: "2.61.0"
ocp_version: "4.21.19"
# Fedora 44 library that oc-mirror gets as libgpgme.so.11.
crc_libgpgme: /usr/lib64/libgpgme.so.45
# Gitignored, personal to a Red Hat account: dropped at the repo root by the operator.
crc_pull_secret_src: "{{ playbook_dir }}/../../pull-secret.txt"
crc_config:
  preset: openshift
  # Unset, crc setup asks the question on a terminal.
  consent-telemetry: "no"
  cpus: 7
  memory: 24576
  # Monitoring needs at least 14 GiB of memory on its own.
  enable-cluster-monitoring: "false"
  disk-size: 50
  pull-secret-file: "/home/{{ trainer_user }}/pull-secret.txt"
