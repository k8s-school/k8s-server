[defaults]
inventory = inventory/
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Native YAML output. The old `stdout_callback = yaml` (community.general.yaml)
# was removed in community.general 12.0.0; use the built-in default + YAML format.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Vault key for group_vars/all/vault.yml. Path is relative to this cfg (the
# ansible/ dir). The file is gitignored (*.vault-pass) — share it out-of-band.
vault_password_file = .vault-pass

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
