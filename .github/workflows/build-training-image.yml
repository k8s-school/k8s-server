name: Build training image

# Builds the golden Scaleway image with Packer, from GitHub's runners instead of
# the operator's laptop. The heavy downloads happen on the short-lived Scaleway
# build instance (fast datacenter network), so a slow operator connection is
# irrelevant. The resulting image is stored as a Scaleway custom image tagged
# `flavor=<flavor>`; `make up` finds it by that tag (no image_id to wire up).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Training flavor to bake
        type: choice
        options: [otel, k8s, openshift]
        default: otel

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provisioning
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.11.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general

      - name: Packer init
        working-directory: provisioning/packer
        run: packer init .

      - name: Packer build
        working-directory: provisioning/packer
        run: packer build -var "flavor=${FLAVOR}" .

      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
          scw version

      - name: Report image and warn on duplicate tags
        working-directory: provisioning/packer
        run: |
          # Scaleway artifact_id is "<zone>:<image-uuid>".
          image_id=$(jq -r '.builds[-1].artifact_id | split(":")[1]' "manifest-${FLAVOR}.json")
          # Count how many images now carry this flavor's tag: `make up` needs
          # exactly one, so surface duplicates here rather than at session time.
          ids=$(scw instance image list zone=fr-par-1 -o json \
            | jq -r --arg t "flavor=${FLAVOR}" '.[] | select((.tags // []) | index($t)) | .id')
          n=$(printf '%s\n' "$ids" | grep -c . || true)
          {
            echo "## Built \`${FLAVOR}\` image"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| flavor | \`${FLAVOR}\` |"
            echo "| image_id | \`${image_id}\` |"
            echo "| images tagged \`flavor=${FLAVOR}\` | ${n} |"
            echo ""
            echo "Found by \`make up\` via the \`flavor=${FLAVOR}\` tag — no tfvars change needed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 1 ]; then
            echo "::warning::${n} images are tagged flavor=${FLAVOR}; 'make up' needs exactly one. Prune stale images with 'make delete-image FLAVOR=${FLAVOR}' or 'scw instance image delete <id> with-snapshots=true'."
          fi

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: packer-manifest-${{ inputs.flavor }}
          path: provisioning/packer/manifest-${{ inputs.flavor }}.json
